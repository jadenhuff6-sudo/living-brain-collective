<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Brain</title>
<meta name="description" content="Circle of Light's theory of everything, as a living brain. Built from Mastering the Matrix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#06060C; --ink:#EDEBF5; --ink-2:#A9A7B8; --ink-3:#6E6C80;
  --teal:#5FE0EA; --gold:#E5BA6E; --mint:#8CF5C4; --coral:#FF8A7A; --lav:#B9A7FF; --bone:#F2F0E6;
  --glass:rgba(14,14,26,.72); --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.pointing{cursor:pointer}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-140%);white-space:nowrap;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--ink);opacity:0;transition:opacity .35s ease;text-shadow:0 0 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.lbl.region{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.lbl.core{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.lbl.hot{color:#fff;font-weight:600}

header{position:fixed;top:20px;left:24px;pointer-events:none;max-width:min(520px,60vw)}
header .eyebrow{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
header h1{font-family:Spectral,serif;font-weight:400;font-size:30px;line-height:1.1;margin-top:6px}
header p{margin-top:8px;color:var(--ink-2);font-size:12.5px;line-height:1.5}

.tools{position:fixed;top:20px;right:20px;display:flex;gap:8px;align-items:center}
.search{position:relative}
.search input{width:220px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px 9px 34px;font:500 12.5px Inter,sans-serif;outline:none;transition:border-color .2s,width .3s}
.search input:focus{border-color:rgba(95,224,234,.55);width:260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.7;z-index:2;color:var(--ink-2);pointer-events:none}
.results{position:absolute;top:42px;right:0;width:280px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;max-height:50vh;overflow:auto}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:9px;font:500 12.5px Inter,sans-serif;cursor:pointer}
.results button:hover,.results button.on{background:rgba(255,255,255,.06)}
.btn{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px;font:600 12px Inter,sans-serif;cursor:pointer;display:flex;gap:7px;align-items:center;transition:border-color .2s,background .2s}
.btn:hover{border-color:rgba(95,224,234,.5)}
.btn.on{background:rgba(95,224,234,.14);border-color:rgba(95,224,234,.6);color:var(--teal)}

.legend{position:fixed;left:20px;bottom:20px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100vw - 40px))}
.chip{display:flex;gap:7px;align-items:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:500 11.5px Inter,sans-serif;color:var(--ink-2);cursor:pointer;transition:all .2s}
.chip:hover,.chip.on{color:var(--ink);border-color:rgba(95,224,234,.5)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}

.keys{position:fixed;right:20px;bottom:20px;display:flex;gap:10px;font-size:11px;color:var(--ink-3)}
.keys span{display:flex;gap:5px;align-items:center}

#hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);font-size:12px;color:var(--ink-2);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);padding:8px 14px;border-radius:999px;transition:opacity .8s;pointer-events:none}

#tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:260px;opacity:0;transform:translate(14px,14px);transition:opacity .15s}
#tip .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
#tip .n{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}

#panel{position:fixed;top:72px;right:20px;bottom:20px;width:390px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);border-radius:20px;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
#panel .top{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
#panel .kind{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;display:flex;gap:8px;align-items:center}
#panel h2{font-family:Spectral,serif;font-weight:400;font-size:24px;line-height:1.2;margin-top:8px;padding-right:20px}
#panel .status{display:inline-flex;margin-top:12px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
#panel .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}
#panel .close:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
#panel .body{padding:16px 22px 22px;overflow:auto;flex:1}
#panel .summary{font-size:14px;line-height:1.6;color:var(--ink)}
#panel h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:22px 0 10px}
.quote{border-left:2px solid var(--teal);padding:2px 0 2px 14px;margin-bottom:14px}
.quote p{font-family:Spectral,serif;font-style:italic;font-size:15.5px;line-height:1.5;color:var(--ink)}
.quote small{display:block;margin-top:6px;font-size:11px;color:var(--ink-3);font-family:Inter,sans-serif;font-style:normal}
.note{font-size:12.5px;line-height:1.55;color:var(--ink-2);background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 12px Inter,sans-serif;cursor:pointer;transition:all .2s;text-align:left}
.links button:hover{border-color:rgba(95,224,234,.5);background:rgba(95,224,234,.08)}
.step{display:flex;justify-content:space-between;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}
.step button{flex:1}

@media (max-width:760px){
  header h1{font-size:22px} header p{display:none}
  .tools{top:auto;bottom:calc(env(safe-area-inset-bottom) + 16px);right:16px;left:16px;justify-content:space-between}
  .search input{width:100%} .search{flex:1} .search input:focus{width:100%}
  .results{top:auto;bottom:44px;left:0;right:auto;width:100%}
  .legend{display:none} .keys{display:none} #hint{bottom:70px;white-space:nowrap}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:62vh;transform:translateY(calc(100% + 20px))}
}
@media (prefers-reduced-motion:reduce){#panel,.lbl,#tip{transition:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>

<header>
  <div class="eyebrow">Theory of Everything</div>
  <h1>Living Brain</h1>
  <p id="sub">Master your mind, master reality.</p>
</header>

<div class="tools">
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search the brain" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <button class="btn" id="tourBtn" title="Guided tour (T)"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>Tour</span></button>
  <button class="btn" id="homeBtn" title="Whole brain (Esc)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<div class="legend" id="legend"></div>
<div class="keys"><span>Drag to turn</span><span>Scroll to zoom</span><span>← → to walk</span></div>
<div id="hint">Hover any light to preview it. Click to fly in.</div>
<div id="tip"><div class="t"></div><div class="n"></div></div>

<aside id="panel" aria-live="polite">
  <div class="top">
    <div class="kind"><span class="dot"></span><span class="kindtxt"></span></div>
    <h2></h2>
    <span class="status"></span>
    <button class="close" aria-label="Close">×</button>
  </div>
  <div class="body"></div>
  <div class="step"><button class="btn" id="prevBtn">← Previous</button><button class="btn" id="nextBtn">Next →</button></div>
</aside>

  {id:'S1',type:'story',title:'The Bundys: the pen, not the blood',regions:['history'],status:'On the record',summary:'Harvey Bundy ran the atomic bomb paperwork. McGeorge drafted the article that defended Hiroshima. William\'s bureau drafted the Vietnam war resolution before Tonkin.',quotes:[Q('They didn\'t drop the bomb. They wrote the story.','MTM71')],note:'Documented. Ted Bundy is not part of this family; Bundy was his stepdad\'s name.'},
  {id:'S2',type:'story',title:'Skull and Bones',regions:['history','traditions'],status:'On the record',summary:'Fifteen Yale seniors a year, about 800 living members. A death and rebirth initiation, and secrets that bind members for life.',quotes:[Q('That should tell you everything you need to know about there being a red side and a blue side.','MTM71 · Bush vs Kerry')],note:'The Geronimo skull story is unproven.'},
  {id:'S3',type:'story',title:'Who wrote the Hiroshima story',regions:['history','shadow'],status:'On the record',summary:'The "over a million casualties" line comes from a 1947 Harper\'s article signed by Stimson and drafted by McGeorge Bundy.',quotes:[Q("There's no justification for dropping bombs.",'MTM71 · 1:41:06')],note:'The 1946 Strategic Bombing Survey said Japan would likely have surrendered by end of 1945. Some wartime studies did project very high invasion casualties.'},
  {id:'S4',type:'story',title:'Tonkin: the permission slip came first',regions:['history'],status:'On the record',summary:'A war resolution was drafted in June 1964. The August 4 attack never happened, per the NSA\'s own historian. Congress passed it 88 to 2 and 416 to 0.',quotes:[]},
  {id:'S5',type:'story',title:'Who controls money creation',regions:['history','science'],status:'Guest claim',summary:'Simon Dixon\'s case: real power sits with whoever controls how money gets created, not presidents.',quotes:[Q("Money is not real. Let me tell you that because if I can just create it. Then I have an unlimited amount. There is no cap.","MTM32 \u00b7 0:15:04")],note:'From MTM70. The Fort Knox "double-booked" and BIS "own army" claims were fact-checked wrong.'},
  {id:'S6',type:'story',title:'The 13 families',regions:['history','shadow'],status:'Theory, unproven',summary:'Fritz Springmeyer\'s claim. The series tests it family by family: the Astors, the Bundys, next the Collins.',quotes:[Q('Families that are in power use countries to wage war, and they hide in the shadows while they reap all the benefits.','MTM71 · 2:12:18'),Q("I think that's my goal with this platform is to show you guys how everything is all connected, from the thirteen families to transnational capital to the wars and um. Iran to the history we are taught, whether it's academia, archaeology, through the pharmaceutical companies, through aliens and disclosure, all of these things are connected because there's only 13 families that actually run the world.","MTM62 \u00b7 2:16:46")],note:"The access and the paper trail are documented. One hidden family running it all is not. Crew (MTM61, MTM62): the money networks are documented; the exact thirteen traces to Springmeier's own notes, and his book is mostly unsourced."},

  {id:"P8",type:"principle",title:"Rebuild yourself from the studs",regions:["identity", "traditions", "experience"],status:"Growing · 2 episodes",
   summary:"The old initiations act out a death and a rebirth. I lived one: after a hard stretch I rebuilt myself on purpose, as the exact person I wanted to be. That is how the esoteric stories turn into practice.",
   quotes:[Q("I had to rebuild myself from the studs, right?","MTM73 \u00b7 0:45:54"),Q("I think that's a perfect example of how we can learn from these this esoteric wisdom, and apply it.","MTM73 \u00b7 0:46:32"),Q("What was most important during that time was recreating. The exact person I wanted to be, and you don't realize that until you're deep into it.","MTM73 \u00b7 0:47:48"),Q("getting back to drawing the things I used to love as a kid before the world told me who I was.","MTM48 \u00b7 0:21:19")],
   note:"Lived experience, not research. I told the fuller story on MTM73 and in Field Notes."},
  {id:"P9",type:"principle",title:"Stop editing yourself",regions:["identity", "practice"],status:"Seed \u00b7 1 episode",
   summary:"Other people's opinions edit you like a rough draft until you are not the same paper. Not caring what they think is the first step to mastering yourself, and so the matrix.",
   quotes:[Q("That is probably the first step in the journey of mastering yourself, which is ultimately mastering the matrix.","MTM73 \u00b7 1:07:53"),Q("Somebody that's not deep rooted will probably start to edit themselves","A guest, MTM73 \u00b7 1:06:02")],
   note:"The rough-draft picture is a guest's; I agreed and made it one of my ten commandments (FOPO, after Michael Gervais's book)."},
  {id:"P10",type:"principle",title:"Own your awareness",regions:["consciousness", "science", "history"],status:"Growing · 2 episodes",
   summary:"Attention is energy, and they have most of ours. Whoever holds your data can predict and steer your future, so awareness comes first. The same technology can be turned back around.",
   quotes:[Q("Like that's our most important commodity. Everything else stems from that.","MTM73 \u00b7 1:14:44"),Q("They have all of our attention and all of our energy, and they're using it against us.","MTM73 \u00b7 1:14:44"),Q("They can not only predict your future, but they can manipulate your future","MTM73 \u00b7 1:15:43"),Q("The same technology they're using against us, we can be using against them.","MTM73 \u00b7 1:04:04"),Q("Exactly, our consciousness, our awareness \u2014 that's the most important thing you have. That's what they're trying to get from you, whether it's through Fanduel, TikTok, IG, OnlyFans.","MTM31 \u00b7 2:24:15")],
   note:"\"A surveillance state that is almost complete\" is my read, not a checked fact."},
  {id:"P11",type:"principle",title:"Be the person, not the goal",regions:["identity", "practice", "consciousness"],status:"Growing · 3 episodes",
   summary:"Behind every goal is an identity. Ask what the version of you who already did it does every day, and be that now. Our mind creates reality.",
   quotes:[Q("If you have a goal, there's an identity of what you look like, the version of you that accomplished said goal.","MTM73 \u00b7 1:50:17"),Q("What does he do on a daily basis? What does he embody? How does he think? And just be that","MTM73 \u00b7 1:50:17"),Q("Our mind creates reality.","MTM73 \u00b7 1:49:42"),Q("So, if you can stop yourself from wanting something, you can attract everything.","MTM38 \u00b7 0:07:42"),Q("I disagree with that. I feel like for me, whatever you're chasing, you can give yourself internally. So it's like if you're chasing happiness, you could be happy without thinking there's something attached to that in this physical realm.","MTM57 \u00b7 2:17:10")]},
  {id:"P12",type:"principle",title:"Each generation carries more who wake up",regions:["consciousness", "traditions"],status:"Growing · 3 episodes",
   summary:"Only a few people each generation decode the matrix, and I see that number growing: a new renaissance, with old teachings coming back in new language.",
   quotes:[Q("I think each generation is carrying more and more of those people.","MTM73 \u00b7 0:58:22"),Q("I think we are going back to more of a renaissance age where there's going to be a lot more thought leaders.","MTM73 \u00b7 0:58:22"),Q("It's a few people every generation that like decode the matrix.","A guest, after Nipsey Hussle, MTM73 \u00b7 0:56:52"),Q("I could definitely see myself as a thought leader, as someone who provides my generation and the generations coming after me, just grounding and helping them wake up out of the matrix, so we can master it together.","MTM57 \u00b7 2:38:09"),Q("Yeah, that's what our ancestors did. You feel me? They were think about the slaves that were. They knew that they're just surviving. To To give it to the next generation in hopes that they break out of bondage.","MTM67 \u00b7 2:54:25")],
   note:"Hope and outlook, not a measured trend."},
  {id:"P13",type:"principle",title:"Build the community first",regions:["practice", "experience"],status:"Growing · 4 episodes",
   summary:"Build around people who already show up, grow by word of mouth, and use content as the arena AI lets you scale. Farm more than you hunt.",
   quotes:[Q("Built the app around the community, not the other way around.","MTM73 \u00b7 3:07:37"),Q("You guys are going to be farming more than you're hunting","MTM73 \u00b7 2:58:48"),Q("Content is like the biggest arena you could scale in, and probably the most important one using AI.","MTM73 \u00b7 2:42:30"),Q("we're all just cogs in a wheel at the end of the day. So we need to rise up together as one.","MTM61 \u00b7 2:36:47"),Q("What's most important is for us to band together. We need to recreate tribes and communities, strong community","MTM38 \u00b7 0:44:44"),Q("It's not a cult, but a off - grid community that is self - reliant","MTM46 \u00b7 1:37:51")],
   note:"From the Saturday mastermind. Business details stay with the people building them."},
  {id:"PR10",type:"practice",title:"Be the one who already did it",regions:["practice", "identity"],status:"From MTM73",
   summary:"Pick one goal. Write down what the version of me who hit it does every day, does not do anymore, and how he thinks. Live that today.",
   quotes:[Q("What does he embody? How does he think?","MTM73 \u00b7 1:50:17"),Q("So, whatever you guys feel called in your heart to be, you are already that. You're just remembering who you are.","MTM57 \u00b7 2:37:10"),Q("anybody who's working on mastering the matrix understands that it's hard when you first start, and you realize how many people are resistant to that mindset and cling to what they know","MTM38 \u00b7 0:31:45"),Q("stop focusing on doing and start focusing on being. Like, what do you want? What is the version of you look like that has that","MTM51 \u00b7 0:41:07")]},
  {id:"S7",type:"story",title:"Lost the throne, kept the money",regions:["history"],status:"On the record",
   summary:"Italy took Rome in 1870 and the Pope lost his land. In 1929 Mussolini's Lateran deal gave the Vatican its own state plus about 750 million lire in cash and a billion in bonds. A banker, Bernardino Nogara, invested it, and it seeded the modern Vatican fortune.",
   quotes:[Q("Yeah, why give him all that damn cash?","MTM73 \u00b7 0:37:33"),Q("Kept the money, has a paper trail.","Crew, MTM73 \u00b7 0:37:07")],
   note:"Documented. Officially it paid for the land taken in 1870; Mussolini also needed the Church behind his rule. The Vatican has never opened its full books."},
  {id:"S8",type:"story",title:"Napoleon vs the Pope, and the lodges",regions:["history", "traditions"],status:"On the record",
   summary:"Napoleon took Rome in 1798 (Pius VI died a prisoner), took the rest of the Papal States in 1809 and held Pius VII about five years. He did not ban the Freemasons; he turned the lodges into a loyalty network, with his brother Joseph as Grand Master of the Grand Orient from 1804.",
   quotes:[Q("Damn, that's crazy! Yeah, do a deep dive on that.","MTM73 \u00b7 0:42:32")],
   note:"His brothers and many of his generals were Masons. No record of Napoleon's own initiation has been found."},
  {id:"S9",type:"story",title:"The Black Nobility",regions:["history", "shadow"],status:"Guest claim, unproven",
   summary:"Fritz Springmeier's claim: a layer above the 13 families, old bloodlines tracing back to the Roman emperors, that never gave up power and went underground instead.",
   quotes:[Q("They went underground, so to speak, where it's harder for us to see.","Fritz Springmeier, MTM73 \u00b7 0:34:22")],
   note:"The first five Roman emperors really were one family. The link from them to the Orsini and later families has no solid record. Paul VI did clear many hereditary papal court offices in March 1968."},
  {id:"S10",type:"story",title:"Egypt and the mystery schools",regions:["traditions", "history"],status:"Partly on the record",
   summary:"Napoleon's 1798 Egypt expedition brought scholars who measured the pyramids, and his soldiers found the Rosetta Stone. Lodges took up Egyptian rites built on the Osiris story: a symbolic death, and rising as a new man.",
   quotes:[Q("The heart of it is the story of Osiris, who was killed, put back together by Isis, and reborn.","Crew, MTM73 \u00b7 0:44:37")],
   note:"Much of the \"ancient Egyptian\" ritual was written in 18th-century Europe, starting with the 1731 novel Sethos. The King's Chamber story about Napoleon is legend."},

   summary:"My ask for a deep dive: how Napoleon ran an empire through the lodges.",
   quotes:[Q("I need to understand what does Freemasonry look like back then.","MTM73 \u00b7 0:42:32")]},

  {id:"P14",type:"principle",title:"We create reality, together",regions:["consciousness"],status:"Growing \u00b7 4 episodes",
   summary:"Our consciousness creates the universe. When enough of us hold the same belief it becomes real, so we are the authors of reality, not its victims.",
   quotes:[Q("that power of intention, and we create the universe. Our, Minds create the universe. Our consciousness creates the universe","MTM38 \u00b7 0:15:54"),Q("So, if a bunch of us can get together and vibrate at a certain frequency, we can create the reality we want. We're not victims to reality. We're the authors of it.","MTM51 \u00b7 0:05:24"),Q("We create reality, so if enough of us can think in a certain way, we can ultimately overcome the matrix and master it. And now I think that's my ultimate point in streaming is being able to do that and build a community that does that.","MTM46 \u00b7 2:26:09")]},
  {id:"P15",type:"principle",title:"Life is a video game, and I hold the controller",regions:["identity"],status:"Growing \u00b7 5 episodes",
   summary:"I am not the avatar in the simulation. I am the one holding the joystick, with as much power as anyone; most of us have just been asleep at the wheel.",
   quotes:[Q("Life is a video game, but you're the one with the controller. You're not the avatar in the fucking simulation.","MTM47 \u00b7 2:29:50"),Q("thought we are actually the character in the video game, but you're the person actually holding, the fucking joystick.","MTM24 \u00b7 0:35:10"),Q("They're no different than us. You know what I'm saying. We we have just as much power as anybody on this planet. We just have been asleep at the wheel.","MTM59 \u00b7 1:36:17")]},
  {id:"P16",type:"principle",title:"Intuition is the smarter side, the side closer to God",regions:["consciousness"],status:"Growing \u00b7 4 episodes",
   summary:"Logic alone is half-baked. On the big life questions, intuition and the heart are my connection to God; logic is the tool they push.",
   quotes:[Q("Anytime somebody says using logic, it's always half baked because where is the emotion? Where is the intuition, which is actually your smarter side, the side closer to God.","MTM22 \u00b7 0:53:13"),Q("As the Freemasons push logic as God, we what you need to realize is your intuition is your connection to God","MTM55 \u00b7 1:13:55"),Q("You'll have better answers thinking intuitively than thinking logically, because it's easy to get tricked that you're thinking logically, and reality, you're just using logic to justify your emotion.","MTM56 \u00b7 0:42:40")]},
  {id:"P17",type:"principle",title:"An organic, God-created simulation",regions:["science"],status:"Growing \u00b7 3 episodes",
   summary:"I think it is a simulation, but not a computer run by someone else: everything is consciousness and we are all inside God's mind.",
   quotes:[Q("My perspective, I think it is, but not in the traditional way people think. I think it's still an organic, um. God created simulation, but want to get your opinion on that.","MTM41 \u00b7 0:33:21"),Q("God's mind is that computer, and we're all inside God's mind because there is nothing outside of God","MTM24 \u00b7 0:50:34"),Q("what you realize is that everything is consciousness. The physical world is made up of consciousness.","MTM24 \u00b7 0:46:02")],
   note:"Crew: close to the Law of One reading, the one infinite creator exploring itself, not a program run by separate beings."},
  {id:"P18",type:"principle",title:"The world is 1% physical, 99% mental and spiritual",regions:["science"],status:"Growing \u00b7 3 episodes",
   summary:"Spirit leads the mind and the mind leads the body. Fix the inside first; the body is the vehicle.",
   quotes:[Q("this world is made out of. One percent physical and ninety nine percent mental and spiritual.","MTM23 \u00b7 0:19:15"),Q("I want to be really locked in on letting the spirit lead the mind, then the mind lead the body. Instead of a lot of people focus on their mind or focus on their body, but they're not focusing on their spirit.","MTM37 \u00b7 1:03:41")]},
  {id:"P19",type:"principle",title:"Nothing is bad; it just is",regions:["shadow"],status:"Growing \u00b7 4 episodes",
   summary:"There is no negative or positive. The opposite of good is balance, everything happens for my benefit, and there are no accidents.",

  {id:"T4",type:"tension",title:"We create reality, so are we feeding the darkness?",regions:["shadow"],status:"Open",

   note:"Mind: the source I cited is the Corpus Hermeticum; the real mechanism is attention. Test it small before claiming it."},
  {id:"T5",type:"tension",title:"If we all believe, do we get disclosure?",regions:["science"],status:"Open",
   summary:"My own rule says belief creates reality. Mind's pushback: belief has never released a single document.",

  {id:"T6",type:"tension",title:"If the universe is karmic, how do the elites get away with it?",regions:["shadow"],status:"Open",
   summary:"They seem to know the secrets of the universe well enough to dodge karma. I can't just act like it isn't happening.",
   quotes:[Q("That's what I always wondered. Is like these elites know the secrets to the universe, to the point where karma \u2014 it feels like karma is absent, or maybe they just. You know, it'll happen when it happens. But there's something up with elites consistently doing evil shit, but not facing the consequences of it. And I think a big reason why is they know the secrets to the universe.","MTM48 \u00b7 1:01:42"),Q("I think the point is the why behind it and the how. Like, how are these elites able to get away with so much? Considering we live in a universe that is karmic.","MTM49 \u00b7 0:05:06"),Q("They've clearly ascended past karma. You feel me? Like they've you talk about one thing you learn in a lot of these spiritual practices is that that you can ascend above dualism.","MTM52 \u00b7 1:44:17")],
   note:"Higher Self: the how is documented and human (legal immunity, information control, spread-out accountability). Karma as a law is a separate claim. The dark path is brittle because it depends on separation."},
  {id:"P20",type:"principle",title:"Humans made this reality, not evil beings",regions:["shadow"],status:"Growing \u00b7 2 episodes",
   summary:"I don't buy that evil beings manage us. Humans created this world, so it's on us to be accountable for it. I'd rather see Earth as a spirit school than a prison.",
   quotes:[Q("I don't necessarily subscribe to gnosticism to the extent that basically we are being managed and controlled by evil beings. I think humans are the ones that created this reality, and we are all good and evil, and people have just chosen evil very consistently.","MTM44 \u00b7 1:32:26"),Q("Which has created this world, so I think it's time for us as humans to be accountable for the world and the reality we created, because our mind creates reality.","MTM44 \u00b7 1:32:58"),Q("And I like to subscribe to that, just being an optimist","MTM20 \u00b7 0:08:29")],
   note:"Higher Self: no good evidence of non-human controllers; human systems acting like a prison is the stronger explanation."},

  {id:"P22",type:"principle",title:"Stay a student",regions:["identity"],status:"Growing \u00b7 4 episodes",
   summary:"You can't learn if you never admit you're wrong. The smartest people know how little they know, and growing matters more than being right.",

  {id:"PR12",type:"practice",title:"Do something hard every day, starting with the hardest",regions:["practice"],status:"From MTM37 + 2 more",

  {id:"PR14",type:"practice",title:"Argue it 100% true, then 100% false",regions:["practice"],status:"From MTM23 + 6 more",
   summary:"My way to test a claim: have the crew act as if it's fully true and find the evidence, then argue the opposite, counter-case first.",

  {id:"T10",type:"tension",title:"Crime funding secret programs?",regions:["history", "shadow"],status:"Open \u00b7 unproven",
   summary:"On Joe Rogan's show, David Grusch said officers inside one agency ran criminal schemes, including child trafficking, to wash money for hidden programs, and that he briefed members of Congress in a classified setting. We broke it down on MTM64. I reacted hard and asked Mind to dig. My read: we know this is happening. The proof for his specific claim is not public.",
   quotes:[Q("Child trafficking? Are you fucking kidding me? That's where our tax dollars are going.","MTM64 \u00b7 1:11:39"),Q("And they can we do some deep research on child trafficking and the CIA or these black government agencies using that.","MTM64 \u00b7 1:17:40"),Q("I'm sick to my stomach. That is disgusting.","MTM64 \u00b7 1:32:56"),Q("The David Grush guy \u2014 he talked about how he found out that there were CIA agents who were running child sex trafficking rings to get revenue for certain projects","MTM66 \u00b7 3:42:51"),Q("So it's like we know this shit is happening. We know this shit exists.","MTM66 \u00b7 3:44:19")],
   note:"Source: David Grusch on The Joe Rogan Experience, played and broken down on MTM64 (Oct 1). He says he briefed Congress in a classified setting and that an investigation is ongoing. Crew: that is his own account, not proof yet; records or other witnesses would confirm it, and none of that proof is public. What is on record: contractors in Bosnia bought trafficked girls and the woman who reported it was fired; a 2017 US government watchdog report found the Pentagon kept funding Afghan units accused of abusing boys (bacha bazi), and soldiers who complained were punished. Crew line: secrecy is how abuse survives, so push for open hearings and records."},

function rand(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
const R = rand(7);
function cortexPoint(side){
  // hemisphere ellipsoid with folds
  const u=R()*Math.PI*2, v=Math.acos(2*R()-1);
  let x=Math.sin(v)*Math.cos(u), y=Math.cos(v), z=Math.sin(v)*Math.sin(u);
  const fold = 1 + .045*Math.sin(u*9+v*5)*Math.sin(v*11-u*3) + .025*Math.sin(u*23+v*17);
  let px = x*0.66*fold, py = y*0.8*fold, pz = z*1.2*fold;
  if (px*side < -0.02) px *= 0.25;            // flatten medial wall
  if (py < -0.35) py = -0.35 + (py+0.35)*0.45; // flatten base
  if (pz > 0.6 && py > 0.2) py -= (pz-0.6)*0.25; // slope frontal lobe
  if (py < 0 && Math.abs(pz) < .5) px += side*.08*(-py); // temporal bulge
  return [px + side*0.55, py + 0.18, pz];
}

    attribute float aRnd; uniform float uTime; uniform float uPR; uniform vec3 uFocus; uniform float uFocusAmt;
    varying float vA; varying float vW;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.0);

  const side = p.x>=0?1:-1; const cx=side*.55;

  const mid = A.pos.clone().add(B.pos).multiplyScalar(.5);
  mid.multiplyScalar(.78).add(new THREE.Vector3(0,.06,0));
  const curve = new THREE.QuadraticBezierCurve3(A.pos.clone(),mid,B.pos.clone());
  const pts = curve.getPoints(28);
  const isRegion = A.type==='region'||B.type==='region';
  const mat = new THREE.LineBasicMaterial({color:isRegion?0x3fb7c2:0x7fe9f1,transparent:true,opacity:isRegion?.07:.16,depthWrite:false,blending:THREE.AdditiveBlending});
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  brain.add(line);
  const e={a:A,b:B,curve,line,mat,base:mat.opacity,isRegion};
  edgeObjs.push(e); A.edges.push(e); B.edges.push(e);
});

function fillPanel(n){
  const t = n.type==='region'?{label:'Region',color:n._region.color}:TYPES[n.type];
  const dot=panel.querySelector('.kind .dot'); dot.style.color=t.color; dot.style.background=t.color;
  const kt=panel.querySelector('.kindtxt'); kt.textContent=t.label; kt.style.color=t.color;
  panel.querySelector('h2').textContent=n.title;
  panel.querySelector('.status').textContent=n.status;
  pBody.innerHTML='';
  if(n.summary) pBody.appendChild(el('p','summary',n.summary));
  if(n.type==='region'){
    const members=NODES.filter(m=>m.type!=='region'&&m.regions.includes(n.id));
    pBody.appendChild(el('p','summary',members.length+' ideas live in this part of the brain.'));
  }
  if(n.quotes&&n.quotes.length){
    pBody.appendChild(el('h3',null,'In my words'));
    n.quotes.forEach(q=>{ const b=el('div','quote'); b.appendChild(el('p',null,'“'+q.q+'”')); b.appendChild(el('small',null,q.src)); pBody.appendChild(b); });
  }
  if(n.note){ pBody.appendChild(el('h3',null,'What holds up')); pBody.appendChild(el('div','note',n.note)); }
  const nb=[...n.neighbors].sort((a,b)=>(a.type==='region')-(b.type==='region'));
  if(nb.length){
    pBody.appendChild(el('h3',null,'Connected'));
    const wrap=el('div','links');
    nb.forEach(m=>{ const b=el('button'); const d=el('span','dot'); const c=m.type==='region'?m._region.color:TYPES[m.type].color; d.style.color=c; d.style.background=c; b.appendChild(d); b.appendChild(document.createTextNode(m.title));
      b.onmouseenter=()=>{hoverNode=m;}; b.onmouseleave=()=>{hoverNode=null;};
      b.onclick=()=>{stopTour();select(m);}; wrap.appendChild(b); });
    pBody.appendChild(wrap);
  }
  pBody.scrollTop=0;
}
panel.querySelector('.close').onclick=()=>{stopTour();home();};

/* ---------------- CAMERA FLIGHT ---------------- */
let flight=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(pos,target,ms=1300){
  const sp=camera.position.clone(), st=controls.target.clone();
  if(reduce){ camera.position.copy(pos); controls.target.copy(target); return; }
  flight={sp,st,ep:pos.clone(),et:target.clone(),t0:performance.now(),ms};
}
function worldPos(n){ return n.pos.clone().applyMatrix4(brain.matrixWorld); }
let selected=null, hoverNode=null;
function select(n){
  if(!n) return;
  selected=n; fillPanel(n); panel.classList.add('open');
  const wp=worldPos(n);
  const out = wp.clone().sub(new THREE.Vector3(0,.15,0)); if(out.length()<.2) out.set(.6,.3,1);
  out.normalize();
  const dist = n.type==='region'?2.0:(n.type==='core'?2.4:1.55);
  const narrow = innerWidth<760;
  const camPos = wp.clone().add(out.multiplyScalar(narrow?dist*1.5:dist)).add(new THREE.Vector3(0,.12,0));
  // shift target so node sits left of the panel on desktop
  const tgt = wp.clone();
  if(!narrow){ const right=new THREE.Vector3().subVectors(camPos,tgt).cross(camera.up).normalize(); tgt.add(right.multiplyScalar(-dist*.22)); }
  else { tgt.y -= dist*.35; }
  flyTo(camPos,tgt);
  controls.autoRotate=false;
  fireNode(n,1.2,1.4);
  REGIONS.forEach(r=>r.chip.classList.toggle('on',n.type==='region'&&r.id===n.id));
  hideHint();
}
function home(){
  selected=null; panel.classList.remove('open');
  REGIONS.forEach(r=>r.chip.classList.remove('on'));
  flyTo(HOME.pos,HOME.target,1500);
  controls.autoRotate=!reduce;
}
document.getElementById('homeBtn').onclick=()=>{stopTour();home();};

/* ---------------- TOUR ---------------- */
let touring=false, tourIdx=-1, tourTimer=null;
const tourBtn=document.getElementById('tourBtn');
function step(dir){
  const order = TOUR;
  let i = selected? order.indexOf(selected.id) : -1;
  if(i===-1){ const all=NODES.filter(n=>n.type!=='region').map(n=>n.id); i=selected?all.indexOf(selected.id):-1;
    const next=all[(i+dir+all.length)%all.length]; select(byId[next]); return; }
  select(byId[order[(i+dir+order.length)%order.length]]);
}
function startTour(){ touring=true; tourBtn.classList.add('on'); tourBtn.querySelector('span').textContent='Touring';
  tourIdx = selected? Math.max(0,TOUR.indexOf(selected.id)) : 0; select(byId[TOUR[tourIdx]]);
  clearInterval(tourTimer); tourTimer=setInterval(()=>{ tourIdx=(tourIdx+1)%TOUR.length; select(byId[TOUR[tourIdx]]); },7500); }
function stopTour(){ if(!touring) return; touring=false; clearInterval(tourTimer); tourBtn.classList.remove('on'); tourBtn.querySelector('span').textContent='Tour'; }
tourBtn.onclick=()=>touring?stopTour():startTour();
document.getElementById('prevBtn').onclick=()=>{stopTour();step(-1);};
document.getElementById('nextBtn').onclick=()=>{stopTour();step(1);};

/* ---------------- SEARCH ---------------- */
const qIn=document.getElementById('q'), resEl=document.getElementById('results');
let resList=[], resIdx=0;
function hay(n){ return (n.title+' '+n.summary+' '+(n.quotes||[]).map(q=>q.q).join(' ')).toLowerCase(); }
function renderResults(){
  const s=qIn.value.trim().toLowerCase();
  if(!s){ resEl.style.display='none'; resList=[]; return; }
  resList=NODES.filter(n=>hay(n).includes(s)).slice(0,10); resIdx=0;
  resEl.innerHTML='';
  if(!resList.length){ resEl.appendChild(el('div','note','Nothing yet. This brain grows with every episode.')); }
  resList.forEach((n,i)=>{ const b=el('button',i===0?'on':null); const d=el('span','dot'); const c=n.type==='region'?n._region.color:TYPES[n.type].color; d.style.color=c; d.style.background=c; b.appendChild(d); b.appendChild(document.createTextNode(n.title));
    b.onmouseenter=()=>{hoverNode=n;}; b.onmouseleave=()=>{hoverNode=null;};
    b.onclick=()=>{stopTour();select(n);qIn.value='';renderResults();qIn.blur();}; resEl.appendChild(b); });
  resEl.style.display='block';
}
qIn.addEventListener('input',renderResults);
qIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&resList[resIdx]){ stopTour(); select(resList[resIdx]); qIn.value=''; renderResults(); qIn.blur(); }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+resList.length)%Math.max(resList.length,1);
    [...resEl.children].forEach((c,i)=>c.classList.toggle('on',i===resIdx)); hoverNode=resList[resIdx]; }
  if(e.key==='Escape'){ qIn.value=''; renderResults(); qIn.blur(); }
  e.stopPropagation();
});

/* ---------------- POINTER ---------------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(-9,-9);
const tip=document.getElementById('tip');
let downAt=null, moved=false, lastInput=performance.now();
canvas.addEventListener('pointermove',e=>{
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px';
  if(downAt && Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5){ moved=true; canvas.classList.add('dragging'); }
  lastInput=performance.now();
});
canvas.addEventListener('pointerleave',()=>{ mouse.set(-9,-9); });
canvas.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; moved=false; stopTour(); hideHint(); lastInput=performance.now(); });
canvas.addEventListener('pointerup',e=>{
  canvas.classList.remove('dragging');
  if(downAt && !moved){
    mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(pickables)[0];
    if(hit) select(hit.object.userData.node); else if(selected) home();
  }
  downAt=null;
});
addEventListener('keydown',e=>{
  if(e.target===qIn) return;
  if(e.key==='Escape'){ stopTour(); home(); }
  if(e.key==='ArrowRight'){ stopTour(); step(1); }
  if(e.key==='ArrowLeft'){ stopTour(); step(-1); }
  if(e.key==='t'||e.key==='T'){ touring?stopTour():startTour(); }
  if(e.key==='/'){ e.preventDefault(); qIn.focus(); }
  lastInput=performance.now();
});
const hint=document.getElementById('hint'); let hintGone=false;
function hideHint(){ if(hintGone) return; hintGone=true; hint.style.opacity=0; }
setTimeout(hideHint,9000);

/* ---------------- RESIZE ---------------- */
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight;
  camera.fov = innerWidth<760?54:42; camera.updateProjectionMatrix(); shellMat.uniforms.uPR.value=renderer.getPixelRatio(); }
addEventListener('resize',resize); resize();

/* ---------------- LOOP ---------------- */
const clock=new THREE.Clock(); let nextFire=1.2;
const tmp=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  shellMat.uniforms.uTime.value=t;

  if(flight){
    const k=Math.min(1,(performance.now()-flight.t0)/flight.ms), e=ease(k);
    camera.position.lerpVectors(flight.sp,flight.ep,e); controls.target.lerpVectors(flight.st,flight.et,e);
    if(k>=1) flight=null;
  }
  controls.update();

  // hover
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObjects(pickables)[0];
  const pointerHover = h?h.object.userData.node:null;
  canvas.classList.toggle('pointing',!!pointerHover);
  const hv = hoverNode||pointerHover;
  if(pointerHover){ const ty=pointerHover.type==='region'?{label:'Region',color:pointerHover._region.color}:TYPES[pointerHover.type];
    tip.querySelector('.t').textContent=ty.label; tip.querySelector('.t').style.color=ty.color; tip.querySelector('.n').textContent=pointerHover.title; tip.style.opacity=1; }
  else tip.style.opacity=0;

  // focus set
  const focus = hv||selected;
  const near = new Set(); if(focus){ near.add(focus); focus.neighbors.forEach(m=>near.add(m)); }
  if(focus){ shellMat.uniforms.uFocus.value.copy(focus.pos); }
  shellMat.uniforms.uFocusAmt.value += ((focus?1:0)-shellMat.uniforms.uFocusAmt.value)*.06;

  // ambient firing: the brain is thinking
  if(!reduce && t>nextFire){
    const pool = NODES.filter(n=>n.type!=='region');
    const n = (focus && Math.random()<.55)? [...near][Math.floor(Math.random()*near.size)] : pool[Math.floor(Math.random()*pool.length)];
    fireNode(n,1,1,true); nextFire=t+.5+Math.random()*.9;
  }
  if(selected && !reduce && Math.random()<dt*1.2) fireNode(selected,1.1,1.2);

  // nodes
  NODES.forEach(n=>{
    const target = focus? (near.has(n)?1:.18) : 1;
    n.dim += (target-n.dim)*.12;
    n.flash = Math.max(0,n.flash-dt*1.6);
    const breathe = reduce?1:1+.08*Math.sin(t*1.5+n.phase);
    const big = (n===focus?1.6:1) + n.flash*.7;
    n.halo.scale.setScalar(n.baseScale*breathe*big);
    n.halo.material.opacity = (n.type==='region'?.5:.85)*n.dim + n.flash*.3;
    n.core.material.opacity = Math.min(1,.25+n.dim);
    // label
    tmp.copy(n.pos).applyMatrix4(brain.matrixWorld);
    const dCam = tmp.distanceTo(camera.position);
    tmp.project(camera);
    const L=n.label;
    if(tmp.z>1){ L.style.opacity=0; return; }
    L.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-150%)`;
    let show=0;
    const always = n.type==='core'||n.type==='region'||n.type==='principle';
    if(focus){ if(near.has(n)) show = n===focus?1:.85; }
    else if(always){ const reach = n.type==='principle'?3.0:5.5; show = Math.max(0,Math.min(1,(reach-dCam)/1.0)) * (n.type==='principle'?.8:1); }
    if(n===hv) show=1;
    L.style.opacity=show;
    L.classList.toggle('hot',n===focus);
  });

  // edges
  edgeObjs.forEach(e=>{
    const on = focus && (e.a===focus||e.b===focus);
    const target = on? .75 : (focus? e.base*.35 : e.base);
    e.mat.opacity += (target-e.mat.opacity)*.12;
  });

  // pulses
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i]; p.t+=dt*p.speed;
    if(p.t>=1){ brain.remove(p.s); p.s.material.dispose(); pulses.splice(i,1); const dest=p.fwd?p.e.b:p.e.a; dest.flash=Math.max(dest.flash,.6*p.bright); continue; }
    const u = p.fwd?p.t:1-p.t;
    p.e.curve.getPoint(u,p.s.position);
    const f = Math.sin(p.t*Math.PI);
    p.s.material.opacity = f*(focus&&!(near.has(p.e.a)&&near.has(p.e.b))?.25:1);
    p.s.scale.setScalar((.03+.03*f)*p.bright);
  }

  // idle: auto tour after a while
  if(!touring && !selected && performance.now()-lastInput>45000 && !reduce){ startTour(); }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
document.getElementById('sub').textContent = `Master your mind, master reality. ${NODES.filter(n=>n.type==='principle').length} principles, ${NODES.filter(n=>n.type==='practice').length} practices and ${NODES.filter(n=>n.type==='story').length} stories from ${(()=>{const E=new Set();NODES.forEach(n=>{(n.quotes||[]).forEach(q=>{const m=String(q.src||'').match(/MTM\s?(\d+(?:\.5)?)/);if(m)E.add(m[1]);});const m=n.type==='episode'&&String(n.title).match(/MTM\s?(\d+)/);if(m)E.add(m[1]);});return E.size;})()} episodes of Mastering the Matrix, in my own words. It grows with every stream.`;
</script>
</body>
</html>
